[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "uniflow-student-planner"
version = "0.1.0"
description = "A student assignment planner built with Django"
requires-python = ">=3.11"
dependencies = [
  "Django>=5.2,<5.3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-django>=4.8",
]

[tool.setuptools]
packages = ["uniflow", "planner"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "uniflow.settings"
python_files = ["test_*.py", "*_test.py", "tests.py"]
addopts = "-ra"
